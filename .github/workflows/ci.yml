# Lint + test per bagian monorepo. Nama job dipakai sebagai required status check di branch protection
# `main`: kalau mengganti nama job, perbarui juga aturannya di Settings → Branches.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    services:
      # Postgres sementara untuk memastikan semua migrasi bisa diterapkan dari nol.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: djajan
          POSTGRES_PASSWORD: djajan
          POSTGRES_DB: djajan
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U djajan"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Password role di bawah hanya untuk Postgres sementara di runner ini, bukan rahasia.
      - name: Migrations apply on an empty database
        env:
          DATABASE_URL: postgresql://djajan:djajan@localhost:5432/djajan
          APP_BACKEND_DB_PASSWORD: ci-app-backend
          FORECAST_JOB_DB_PASSWORD: ci-forecast-job
          SYNTHETIC_LOADER_DB_PASSWORD: ci-synthetic-loader
        run: |
          npm run migrate
          npm run migrate:status
      - name: Database role integration tests
        env:
          INTEGRATION_DATABASE_URL: postgresql://djajan:djajan@localhost:5432/djajan
          SYNTHETIC_LOADER_DB_PASSWORD: ci-synthetic-loader
        run: npx vitest run tests/syntheticLoader.int.test.js

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  ml-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ml-pipeline
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ml-pipeline/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest
